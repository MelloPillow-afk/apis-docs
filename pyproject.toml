[project]
name = "apis-docs"
version = "0.1.0"
description = "API reference pages generated from each service's OpenAPI spec."
requires-python = ">=3.13"
dependencies = [
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

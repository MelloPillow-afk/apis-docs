description: Path, query, or body values failed native request validation.
content:
  application/json:
    schema:
      type: object
      required:
        - detail
      description: Native FastAPI request-validation errors.
      properties:
        detail:
          type: array
          items:
            type: object
            required:
              - loc
              - msg
              - type
            properties:
              loc:
                type: array
                items:
                  anyOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
      examples:
        - detail:
            - loc: [body, title]
              msg: Field required
              type: missing

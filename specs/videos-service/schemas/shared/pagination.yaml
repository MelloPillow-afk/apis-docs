x-python-module: shared
x-python-name: Pagination
type: object
required:
  - next_page_token
  - has_more
description: >-
  Where a page of results ends. Pass next_page_token as the page_token query
  parameter, with the same filters, to request the next page.
properties:
  next_page_token:
    type:
      - string
      - 'null'
    description: Token for the next page, or null on the last page.
  has_more:
    type: boolean
    description: Whether another page of results is available.
examples:
  - next_page_token: null
    has_more: false

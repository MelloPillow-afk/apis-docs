x-python-module: uploads
x-python-name: Upload
type: object
required:
  - upload_id
  - method
  - url
  - headers
  - expires_at
description: File upload URL and instructions.
properties:
  upload_id:
    type: string
    format: uuid
  method:
    type: string
    const: PUT
  url:
    type: string
    format: uri
    pattern: ^https://
    description: URL to use for uploading the file.
  headers:
    type: object
    required:
      - Content-Type
    description: Headers to include with the upload.
    properties:
      Content-Type:
        type: string
    additionalProperties:
      type: string
  expires_at:
    $ref: ../shared/timestamp.yaml
examples:
  - upload_id: 04d1790f-f941-4ba6-8d97-0e6830ca4394
    method: PUT
    url: https://uploads.example.com/source.mp4?signature=example
    headers:
      Content-Type: video/mp4
    expires_at: '2026-10-13T14:15:00Z'
